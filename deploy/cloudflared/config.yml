# Internet -> Cloudflare edge (TLS) -> cloudflared (outbound tunnel,
# no open inbound ports) -> HAProxy (127.0.0.1:8080) -> one of 3 backends.
#
# Replace <your-tunnel-id> and the credentials-file path, and point the
# 3 hostnames below at your actual domain before deploying.
tunnel: <your-tunnel-id>
credentials-file: /etc/cloudflared/<your-tunnel-id>.json

ingress:
  - hostname: finance.yourdomain.com
    service: http://localhost:8080
  - hostname: geochat.yourdomain.com
    service: http://localhost:8080
  - hostname: fitness.yourdomain.com
    service: http://localhost:8080
  - service: http_status:404
