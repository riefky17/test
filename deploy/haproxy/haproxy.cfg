# Routes each of the 3 apps' hostnames to its own backend service.
# Only reachable via cloudflared on 127.0.0.1 -- the VPS firewall denies
# all inbound traffic except SSH, since cloudflared's tunnel connection
# is outbound-only.
global
    log stdout format raw local0
    maxconn 2000

defaults
    log     global
    mode    http
    option  httplog
    timeout connect 5s
    timeout client  30s
    timeout server  30s

# Stats page for a one-glance view of which of the 3 backends is up.
# Bound to loopback only -- never expose this externally.
listen stats
    bind 127.0.0.1:8404
    stats enable
    stats uri /
    stats refresh 10s

frontend fe_main
    bind 127.0.0.1:8080
    mode http
    option httplog

    acl is_finance hdr(host) -i finance.yourdomain.com
    acl is_geochat hdr(host) -i geochat.yourdomain.com
    acl is_fitness hdr(host) -i fitness.yourdomain.com

    use_backend be_finance if is_finance
    use_backend be_geochat if is_geochat
    use_backend be_fitness if is_fitness

    default_backend be_finance

backend be_finance
    server finance1 127.0.0.1:3001 check

backend be_geochat
    mode http
    option forwardfor
    # Websockets pass through HAProxy's default http mode without extra
    # config -- do not switch this backend to tcp mode, which would
    # break the hostname-based ACL routing above.
    server geochat1 127.0.0.1:3002 check

backend be_fitness
    server fitness1 127.0.0.1:3003 check
