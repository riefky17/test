; Drop-in override: `install -D haproxy-override.conf /etc/systemd/system/haproxy.service.d/override.conf`
; then `systemctl daemon-reload`. The stock Debian haproxy unit doesn't
; restart on crash by default -- this stack wants every process
; (finance/geochat/fitness/cloudflared/haproxy) to come back on its own.
[Service]
Restart=on-failure
RestartSec=2
