# Include from postgresql.conf (or append these lines directly) on the
# 1 vCPU / 1GB VPS. Defaults assume multi-GB machines; these values are
# sized for 3 known users across 3 services, not for growth.
shared_buffers = 128MB
work_mem = 4MB
maintenance_work_mem = 32MB
max_connections = 20
effective_cache_size = 256MB
